services:
  - type: web
    name: coastal-ai-agent-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    
    # Environment variables (set GCP_SA_KEY_JSON on Render dashboard)
    envVars:
      - key: GCP_SA_KEY_JSON
        sync: false  # Set manually on dashboard — paste the full JSON key
      - key: GCP_LOCATION
        value: us-central1
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: CHROMA_COLLECTION
        value: coastal_chunks_v3
      - key: JWT_SECRET
        sync: false  # Set on dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set on dashboard for OAuth
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set on dashboard
      - key: TAVILY_API_KEY
        sync: false  # Set on dashboard
    
    # Health check
    healthCheckPath: /health
